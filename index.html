<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Plantillas para generar textos de Instagram y X del GALENO Research Group.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d5a66'/%3E%3Ctext x='32' y='45' font-family='Arial' font-weight='700' font-size='38' text-anchor='middle' fill='white'%3EG%3C/text%3E%3C/svg%3E">
<title>Publicaciones GALENO Research Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: brand band → sticky tab bar → per-tab workspace (form left, live post previews right; stacks on phones) */
:root{
  --bg:#eef3f2; --surface:#ffffff; --surface-2:#f6f9f8; --ink:#11272d; --muted:#566e73; --line:#d3dfdd;
  --primary:#0d5a66; --primary-ink:#ffffff; --primary-soft:#dcecec; --accent:#d6a514; --accent-ink:#2a2003;
  --ok:#1f7a45; --warn:#a86a00; --bad:#b3261e;
  --c-publicacion:#0d5a66; --c-tesis:#6a47b0; --c-eventos:#2c7a4b; --c-estancias:#2563a8; --c-proyectos:#a65512; --c-inside:#a3366c;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b1a1d; --surface:#11262a; --surface-2:#0e2023; --ink:#e2eeee; --muted:#93acb0; --line:#244146;
  --primary:#4fb6c3; --primary-ink:#06262b; --primary-soft:#163b40; --accent:#f0c445; --accent-ink:#2a2003;
  --ok:#5ccf8a; --warn:#f0b54a; --bad:#ff8a80;
  --c-publicacion:#4fb6c3; --c-tesis:#a98ff0; --c-eventos:#62c98c; --c-estancias:#6ea8ee; --c-proyectos:#ec9a55; --c-inside:#ea7fb2;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0b1a1d; --surface:#11262a; --surface-2:#0e2023; --ink:#e2eeee; --muted:#93acb0; --line:#244146;
  --primary:#4fb6c3; --primary-ink:#06262b; --primary-soft:#163b40; --accent:#f0c445; --accent-ink:#2a2003;
  --ok:#5ccf8a; --warn:#f0b54a; --bad:#ff8a80;
  --c-publicacion:#4fb6c3; --c-tesis:#a98ff0; --c-eventos:#62c98c; --c-estancias:#6ea8ee; --c-proyectos:#ec9a55; --c-inside:#ea7fb2;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Brand band */
.brand{background:var(--surface);border-bottom:1px solid var(--line)}
.brand .wrap{display:flex;align-items:center;gap:12px;padding-block:14px;flex-wrap:wrap}
.mark{width:38px;height:38px;border-radius:9px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:20px;flex:none}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:.01em}
.brand-name span{font-weight:600;color:var(--muted)}
.brand-tag{margin-left:auto;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

/* Tabs */
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding-block:6px}
.tab{flex:none;border:0;background:transparent;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
.tab .dot{width:9px;height:9px;border-radius:50%;background:var(--cat,var(--muted))}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--primary-soft);color:var(--ink);box-shadow:inset 0 -3px 0 var(--cat,var(--primary))}

main{padding-block:28px 56px}
.panel{display:flex;flex-direction:column;gap:22px}

/* Home */
.hero{display:grid;gap:14px;max-width:780px}
.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--primary);font-weight:700}
.hero h1{font-size:clamp(30px,5vw,48px);font-weight:800;letter-spacing:-.01em}
.hero p{margin:0;font-size:18px;color:var(--muted);max-width:65ch}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;counter-reset:s;list-style:none;margin:0;padding:0}
.steps li{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-family:var(--font-mono);font-size:14px}
.steps b{display:block}
.steps span{color:var(--muted);font-size:15px}
.section-h{font-size:22px;font-weight:800}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--cat);transition:transform .15s ease, box-shadow .15s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px -14px rgba(0,0,0,.35)}
.card h3{font-size:19px;font-weight:800}
.card p{margin:0;color:var(--muted);font-size:15px}
.card .go{margin-top:auto;font-weight:700;color:var(--cat);font-size:14px}
.settings{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:grid;gap:14px}
.settings p.lead{margin:0;color:var(--muted)}

/* Workspace */
.ws-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.ws-head h2{font-size:clamp(26px,4vw,36px);font-weight:800}
.ws-head h2::before{content:"";display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--cat);margin-right:10px;vertical-align:middle}
.ws-head p{margin:6px 0 0;color:var(--muted);max-width:65ch}
.ws-tools{display:flex;gap:8px;flex-wrap:wrap}
.banner{background:var(--primary-soft);border:1px dashed var(--primary);border-radius:var(--radius);padding:10px 14px;font-size:15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner b{color:var(--primary)}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:24px;align-items:start}
.form{display:flex;flex-direction:column;gap:16px;min-width:0}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 20px;display:grid;gap:14px;min-width:0}
.block-h{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:18px}
.block-h .n{font-family:var(--font-mono);font-size:13px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:grid;gap:5px;min-width:0}
.field.wide{grid-column:1/-1}
.lab-row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
label.lab{font-weight:600;font-size:15px}
.opt{font-weight:400;color:var(--muted);font-size:13px}
.count{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.count.near{color:var(--warn)}
.help{margin:0;font-size:13px;color:var(--muted)}
input[type=text],input[type=url],input[type=email],input[type=date],select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:15px}
textarea{resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:2px solid color-mix(in srgb,var(--primary) 30%,transparent);outline-offset:0}

.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.slot{position:relative;display:flex;flex-direction:column;border:1.5px dashed var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;background:var(--surface-2);min-width:0}
.slot:hover{border-color:var(--primary)}
.slot:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.slot-img{aspect-ratio:4/5;max-width:100%;display:grid;place-items:center;color:var(--muted);font-size:13px;background-size:cover;background-position:center}
.slot-img svg{width:30px;height:30px;stroke:var(--muted)}
.slot.has .slot-img svg,.slot.has .slot-img em{display:none}
.slot-txt{padding:8px 10px;display:grid;font-size:13px;border-top:1px solid var(--line);background:var(--surface)}
.slot-txt small{color:var(--muted)}
.slot-x{position:absolute;top:6px;right:6px;border:0;border-radius:6px;padding:3px 8px;font-size:12px;background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.note{margin:0;font-size:13px;color:var(--muted)}
.note b{font-family:var(--font-mono);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--font-mono);font-size:12.5px;padding:3px 8px;border-radius:999px;background:var(--primary-soft);color:var(--ink);border:1px solid var(--line)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:15px}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:6px 10px;font-size:14px}
.btn.ghost{background:transparent}

/* Preview column */
.aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);display:flex;flex-direction:column;gap:14px;min-width:0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .btn{justify-content:center}
.post{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;min-width:0}
.post-h{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.net{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.net svg{width:17px;height:17px}
.net.ig{background:linear-gradient(135deg,#f9ce34,#ee2a7b 55%,#6228d7);color:#fff}
.net.x{background:var(--ink);color:var(--surface)}
.post-h b{font-size:15px}
.post-h small{display:block;color:var(--muted);font-size:12.5px}
.post textarea{border:0;border-radius:0;background:var(--surface);min-height:220px;font-size:14.5px;padding:12px}
.post textarea.x-out{min-height:150px}
.post-f{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);flex-wrap:wrap;background:var(--surface-2)}
.meter{font-family:var(--font-mono);font-size:12.5px;font-variant-numeric:tabular-nums;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.meter.ok{color:var(--ok)} .meter.warn{color:var(--warn)} .meter.bad{color:var(--bad)}
.post-f .btn{margin-left:auto}
.mailbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;font-size:14.5px;display:grid;gap:8px}
.mailbox ol{margin:0;padding-left:20px;display:grid;gap:2px}
.addr{font-family:var(--font-mono);font-size:13.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;user-select:all;word-break:break-all}
.form-end{display:flex;gap:8px;flex-wrap:wrap}

footer{border-top:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:14px}
footer .wrap{padding-block:18px;display:flex;gap:8px 20px;flex-wrap:wrap;justify-content:space-between}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:20;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:960px){
  .workspace{grid-template-columns:minmax(0,1fr)}
  .aside{position:static}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:620px){
  .steps,.cards,.grid2{grid-template-columns:minmax(0,1fr)}
  .brand-tag{display:none}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>

<header class="brand gutter">
  <div class="wrap">
    <div class="mark" aria-hidden="true">G</div>
    <div class="brand-name">GALENO <span>Research Group</span></div>
    <div class="brand-tag">Plantillas para redes sociales</div>
  </div>
</header>
<nav class="tabbar gutter" aria-label="Plantillas">
  <div class="wrap tabs" role="tablist" id="tabs"></div>
</nav>
<main class="gutter"><div class="wrap" id="panels"></div></main>
<footer class="gutter">
  <div class="wrap">
    <span>Publicaciones GALENO Research Group</span>
    <span>Todo funciona en tu navegador: los datos y las fotos no se suben a ningún sitio.</span>
  </div>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const has = s=>s!=null && String(s).trim()!=='';
const tr = s=>has(s)?String(s).trim():'';
const p = (pre,val,post='')=>has(val)?pre+tr(val)+post:'';
const list = s=>String(s||'').split(/[,;\n]/).map(t=>t.trim()).filter(Boolean);
const joinEs = a=>a.length<=1?(a[0]||''):a.slice(0,-1).join(', ')+(/^[Ii]/.test(a[a.length-1].replace(/^@/,''))&&!/^[Hh]i[aeo]/.test(a[a.length-1])?' e ':' y ')+a[a.length-1];
const people = (men,names)=>{const m=list(men);return m.length?joinEs(m):joinEs(list(names));};
const countPeople = (men,names)=>Math.max(list(men).length,list(names).length);
const q = s=>has(s)?'«'+tr(s)+'»':'';
const fecha = iso=>{if(!has(iso))return'';const d=new Date(iso+'T12:00:00');return isNaN(d)?iso:d.toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'});};
const lines = arr=>arr.filter(has).join('\n');
const blocks = (...bs)=>bs.map(b=>Array.isArray(b)?lines(b):b).filter(has).join('\n\n');
const tidy = s=>s.replace(/[ \t]{2,}/g,' ').replace(/ ([.,;:)])/g,'$1').replace(/\( /g,'(').replace(/\n{3,}/g,'\n\n').trim();
const cap = s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;

const ICON_PHOTO='<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg>';
const ICON_IG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>';
const ICON_X='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.8 3h3.1l-6.8 7.7L22 21h-6.2l-4.9-6.3L5.3 21H2.2l7.3-8.3L2 3h6.4l4.4 5.8L17.8 3zm-1.1 16.2h1.7L7.4 4.7H5.6l11.1 14.5z"/></svg>';

/* ---------- settings ---------- */
const DEFAULT_SETTINGS={name:'GALENO Research Group',ig:'',x:'',tags:'GALENOResearchGroup Investigacion Ciencia',email:''};
let store={settings:{...DEFAULT_SETTINGS},drafts:{}};
try{const raw=localStorage.getItem('galeno-rrss-v1');if(raw){const d=JSON.parse(raw);store.settings={...DEFAULT_SETTINGS,...(d.settings||{})};store.drafts=d.drafts||{};}}catch(e){}
let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('galeno-rrss-v1',JSON.stringify(store));}catch(e){}},300);}

function ctx(t,v){
  const S=store.settings;
  const name=tr(S.name)||'GALENO Research Group';
  const norm=s=>s.replace(/^#/,'').replace(/[^\p{L}\p{N}_]/gu,'');
  const fixed=String(S.tags||'').split(/\s+/).map(norm).filter(Boolean);
  const extra=(t.extraTags||[]);
  const custom=String(v.tags||'').split(/[\s,]+/).map(norm).filter(Boolean).slice(0,2);
  const uniq=a=>a.filter((x,i)=>a.findIndex(y=>y.toLowerCase()===x.toLowerCase())===i);
  return {
    name,
    gIG: tr(S.ig)?(S.ig.startsWith('@')?tr(S.ig):'@'+tr(S.ig)):name,
    gX: tr(S.x)?(S.x.startsWith('@')?tr(S.x):'@'+tr(S.x)):name,
    tagsIG: uniq([...fixed,...extra,...custom]).map(x=>'#'+x).join(' '),
    tagsX: uniq([...custom,...extra,...fixed.slice(0,1)]).slice(0,3).map(x=>'#'+x).join(' ')
  };
}

/* ---------- shared fields ---------- */
const MEN_IG={id:'menIG',label:'Menciones en Instagram',help:'Escribe los @ reales separados por comas. Si alguien no tiene cuenta, pon solo su nombre sin @.'};
const MEN_X={id:'menX',label:'Menciones en X',help:'Igual que arriba, con las cuentas de X.'};

/* ---------- templates ---------- */
const T=[
{
 id:'publicacion',name:'Artículo científico',tab:'Publicaciones',
 desc:'Papers y publicaciones en revistas. Título, hallazgos, aplicación práctica y referencia.',
 intro:'Rellena los datos del artículo y sus hallazgos principales. Los textos para Instagram y X se generan a partir de estos campos.',
 sections:[
  {title:'Datos del artículo',fields:[
   {id:'titulo',label:'Título del artículo',wide:true},
   {id:'revista',label:'Revista'},
   {id:'doi',label:'DOI o enlace',type:'url',ph:'https://doi.org/…'},
   {id:'autores',label:'Autores (nombres completos, separados por comas)',wide:true},
   MEN_IG,MEN_X]},
  {title:'Contenido clave',fields:[
   {id:'gancho',label:'Título llamativo (pregunta o afirmación impactante)',max:100,wide:true},
   {id:'objetivo',label:'Objetivo principal',type:'textarea',max:200,wide:true},
   {id:'h1',label:'Hallazgo 1',max:120,wide:true},
   {id:'h2',label:'Hallazgo 2',max:120,wide:true},
   {id:'h3',label:'Hallazgo 3',max:120,wide:true},
   {id:'h4',label:'Hallazgo 4',max:120,wide:true,opt:true},
   {id:'aplicacion',label:'Aplicación práctica',type:'textarea',max:200,wide:true}]},
  {title:'Referencia bibliográfica',fields:[
   {id:'ref',label:'Referencia completa (formato APA)',type:'textarea',wide:true}]}
 ],
 photos:[{label:'Portada',hint:'Título + abstract'},{label:'Gráfico',hint:'Tabla o figura clave'},{label:'Aplicación',hint:'Infografía o resumen'}],
 subject:v=>v.titulo,
 ig:(v,c)=>blocks(
   ['📄 NUEVA PUBLICACIÓN · '+c.gIG],[v.gancho],
   [p('🎯 Objetivo\n',v.objetivo)],
   [v.h1,v.h2,v.h3,v.h4].some(has)?['🔍 Principales hallazgos',...[v.h1,v.h2,v.h3,v.h4].filter(has).map(h=>'🔹 '+tr(h))]:'',
   [p('💡 Aplicación práctica\n',v.aplicacion)],
   [p('📚 Revista: ',v.revista),p('✍️ Autores: ',people(v.menIG,v.autores)),p('🔗 ',v.doi)],
   [p('📖 ',v.ref)],[c.tagsIG]),
 x:(v,c)=>blocks(

function panelHTML(t){
 let n=0;
 const secs=t.sections.map(s=>`<section class="block"><div class="block-h"><span class="n">${++n}</span>${esc(s.title)}</div><div class="grid2">${s.fields.map(f=>fieldHTML(t,f)).join('')}</div></section>`).join('');
 const photos=`<section class="block"><div class="block-h"><span class="n">${++n}</span>Fotos</div>
   <div class="photos">${t.photos.map((ph,i)=>`<label class="slot" for="${t.id}-ph${i}"><input type="file" accept="image/*" class="sr" id="${t.id}-ph${i}" data-ph="${i}"><span class="slot-img">${ICON_PHOTO}</span><span class="slot-txt"><b>Foto ${i+1}: ${esc(ph.label)}</b><small>${esc(ph.hint)}</small></span></label>`).join('')}</div>
   <p class="note"><b data-phcount>0</b> de ${t.photos.length} ${t.photos.length>1?'fotos seleccionadas':'foto seleccionada'}. Las fotos solo se previsualizan aquí: adjúntalas tú al correo o súbelas al publicar.</p></section>`;
 const tags=`<section class="block"><div class="block-h"><span class="n">${++n}</span>Hashtags</div>
   <div class="field"><label class="lab" for="${t.id}-tags">Hashtags propios de esta publicación (máximo 2, sin #, separados por espacios)</label><input type="text" id="${t.id}-tags" data-f="tags"></div>
   <div class="note">Se añaden automáticamente:</div><div class="chips" data-fixed></div></section>`;
 return `<section class="panel" id="panel-${t.id}" role="tabpanel" aria-labelledby="tab-${t.id}" hidden style="--cat:${COLOR(t.id)}" data-t="${t.id}">
  <div class="ws-head"><div><h2>${esc(t.name)}</h2><p>${esc(t.intro)}</p></div>
   <div class="ws-tools"><button class="btn small ghost" data-act="example">Cargar ejemplo</button><button class="btn small ghost" data-act="clear">Vaciar formulario</button></div></div>
  <div class="banner" data-banner hidden><b>Datos de ejemplo.</b> Sustitúyelos por los tuyos o pulsa «Vaciar formulario».</div>
  <div class="workspace">
   <form class="form" novalidate>${secs}${photos}${tags}
    <div class="form-end"><button type="submit" class="btn primary">Generar textos</button></div>
   </form>
   <aside class="aside" aria-label="Textos generados">
    <div class="actions"><button class="btn primary" data-act="gen">Generar textos</button><button class="btn" data-act="mail">Enviar por email</button></div>
    <div class="mailbox" data-mailbox hidden></div>
    <article class="post"><div class="post-h"><span class="net ig">${ICON_IG}</span><div><b>Instagram</b><small>Pie de foto · máx. 2.200 caracteres y 30 hashtags</small></div></div>
     <textarea id="${t.id}-out-ig" data-out="ig" aria-label="Texto para Instagram" placeholder="Pulsa «Generar textos» para crear el pie de foto."></textarea>
     <div class="post-f"><span class="meter ok" data-meter="ig">0 / 2200</span><span class="meter ok" data-meter="igtags"># 0 / 30</span><button class="btn small" data-copy="ig">Copiar</button></div></article>
    <article class="post"><div class="post-h"><span class="net x">${ICON_X}</span><div><b>X</b><small>Máx. 280 · enlaces cuentan 23 y emojis 2</small></div></div>
     <textarea class="x-out" id="${t.id}-out-x" data-out="x" aria-label="Texto para X" placeholder="Pulsa «Generar textos» para crear el post."></textarea>
     <div class="post-f"><span class="meter ok" data-meter="x">0 / 280</span><button class="btn small" data-copy="x">Copiar</button></div></article>
   </aside>
  </div>
 </section>`;
}
panelsEl.innerHTML=homeHTML()+T.map(panelHTML).join('');

/* ---------- counters ---------- */
const seg=(typeof Intl!=='undefined'&&Intl.Segmenter)?new Intl.Segmenter('es',{granularity:'grapheme'}):null;
const graphemes=s=>seg?Array.from(seg.segment(s),x=>x.segment):Array.from(s);
function xCount(s){
 s=s.normalize('NFC').replace(/https?:\/\/\S+/g,'x'.repeat(23));
 let n=0;
 for(const g of graphemes(s)){
  if(/\p{Extended_Pictographic}/u.test(g)){n+=2;continue;}
  for(const ch of g){const cp=ch.codePointAt(0);n+=(cp<=4351||(cp>=8192&&cp<=8205)||(cp>=8208&&cp<=8223)||(cp>=8242&&cp<=8247))?1:2;}
 }
 return n;
}
function setMeter(el,val,max,warnAt){el.textContent=el.dataset.meter==='igtags'?`# ${val} / ${max}`:`${val} / ${max}`;el.className='meter '+(val>max?'bad':val>=warnAt?'warn':'ok');}
function updateMeters(P){
 const ig=$('[data-out="ig"]',P).value, x=$('[data-out="x"]',P).value;
 setMeter($('[data-meter="ig"]',P),graphemes(ig).length,2200,2000);
 setMeter($('[data-meter="igtags"]',P),(ig.match(/#[\p{L}\p{N}_]+/gu)||[]).length,30,26);
 setMeter($('[data-meter="x"]',P),xCount(x),280,260);
}
function updateCounts(P){
 $$('[data-count]',P).forEach(c=>{const f=$(`[data-f="${c.dataset.count}"]`,P);const max=+f.getAttribute('maxlength');const l=f.value.length;c.textContent=`${l} / ${max}`;c.classList.toggle('near',l>=max*0.9);});
}

/* ---------- state per template ---------- */
const tById=id=>T.find(t=>t.id===id);
const panelOf=id=>$('#panel-'+id);
function readValues(t){const P=panelOf(t.id),v={};$$('[data-f]',P).forEach(el=>v[el.dataset.f]=el.value);return v;}
function writeValues(t,v){const P=panelOf(t.id);$$('[data-f]',P).forEach(el=>{if(el.tagName==='SELECT'){el.value=v[el.dataset.f]||el.options[0].value;}else el.value=v[el.dataset.f]||'';});syncDynamic(t);updateCounts(P);}
function syncDynamic(t){
 const P=panelOf(t.id);
 const tipoSel=$('[data-f="tipo"]',P);
 const idx=tipoSel?tipoSel.selectedIndex:0;
 t.fields.filter(f=>f.byTipo).forEach(f=>{$(`label[for="${t.id}-${f.id}"] .lt`,P).textContent=f.byTipo[idx]||f.label;});
 const premio=$('[data-f="premio"]',P);if(premio)premio.closest('.field').hidden=tipoSel.value!=='Premio recibido';
 const c=ctx(t,{});
 $('[data-fixed]',P).innerHTML=c.tagsIG.split(' ').filter(Boolean).map(h=>`<span class="chip">${esc(h)}</span>`).join('')||'<span class="note">Ninguno (configúralos en Inicio)</span>';
}
function generate(t,quiet){
 const P=panelOf(t.id),v=readValues(t),c=ctx(t,v);
 $('[data-out="ig"]',P).value=tidy(t.ig(v,c));
 $('[data-out="x"]',P).value=tidy(t.x(v,c));
 updateMeters(P);persist(t);
 if(!quiet)toast('Textos generados');
}
function persist(t){const P=panelOf(t.id);store.drafts[t.id]={v:readValues(t),ig:$('[data-out="ig"]',P).value,x:$('[data-out="x"]',P).value,example:!$('[data-banner]',P).hidden};save();}

/* ---------- photos ---------- */
function bindPhotos(t){
 const P=panelOf(t.id);
 const recount=()=>{$('[data-phcount]',P).textContent=$$('.slot.has',P).length;};
 $$('[data-ph]',P).forEach(inp=>{
  const slot=inp.closest('.slot'),img=$('.slot-img',slot);
  inp.addEventListener('change',()=>{
   const f=inp.files&&inp.files[0];if(!f)return;
   if(slot._url)URL.revokeObjectURL(slot._url);
   slot._url=URL.createObjectURL(f);slot._name=f.name;
   img.style.backgroundImage=`url("${slot._url}")`;slot.classList.add('has');
   if(!$('.slot-x',slot)){const b=document.createElement('button');b.type='button';b.className='slot-x';b.textContent='Quitar';
    b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();URL.revokeObjectURL(slot._url);slot._url=null;slot._name=null;img.style.backgroundImage='';slot.classList.remove('has');inp.value='';b.remove();recount();});
    slot.appendChild(b);}
   recount();
  });
 });
}

/* ---------- copy / email / toast ---------- */
let toastT;
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2200);}
function copyText(text,fallbackEl,msg){
 const fb=()=>{if(fallbackEl){fallbackEl.focus();fallbackEl.select();}try{document.execCommand('copy');toast(msg);}catch(e){toast('Selecciona el texto y cópialo con Ctrl+C');}};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast(msg),fb);}else fb();
}
function mail(t){
 const P=panelOf(t.id),v=readValues(t),S=store.settings;
 let ig=$('[data-out="ig"]',P).value,x=$('[data-out="x"]',P).value;
 if(!ig&&!x){generate(t,true);ig=$('[data-out="ig"]',P).value;x=$('[data-out="x"]',P).value;}
 const fotos=$$('.slot.has',P).map(s=>s._name);
 const subject=`[RRSS ${tr(S.name)||'GALENO'}] ${t.name}${has(t.subject(v))?' – '+tr(t.subject(v)):''}`;
 const body=`Tipo de publicación: ${t.name}\n\n===== INSTAGRAM =====\n${ig}\n\n===== X =====\n${x}\n\n===== FOTOS =====\n${fotos.length?fotos.map((n,i)=>`${i+1}. ${n}`).join('\n')+'\n(Adjuntar al correo)':'Sin fotos seleccionadas'}`;
 const box=$('[data-mailbox]',P);
 const email=tr(S.email);
 copyText(subject+'\n\n'+body,null,'Texto copiado al portapapeles');
 const href='mailto:'+encodeURIComponent(email)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body.length>1600?'Pega aquí el texto copiado (Ctrl+V / Cmd+V).':body);
 box.hidden=false;
 if(email){try{location.href=href;}catch(e){}}
 box.innerHTML=email
  ?`<b>Envío por email</b><ol><li>El texto ya está copiado.</li><li><a href="${esc(href)}">Abrir el correo</a> o escribe a <span class="addr">${esc(email)}</span></li><li>Si el correo aparece vacío, pega el texto (Ctrl+V).</li><li>Adjunta ${fotos.length?'las '+fotos.length+' fotos':'las fotos'} antes de enviar.</li></ol>`
  :`<b>Falta el correo de destino.</b><span>El texto ya está copiado. Añade el correo de la persona que gestiona las redes en <button class="btn small" data-go="inicio">Inicio › Ajustes del grupo</button></span>`;
}

/* ---------- wire panels ---------- */
T.forEach(t=>{
 const P=panelOf(t.id),form=$('form',P),banner=$('[data-banner]',P);
 const d=store.drafts[t.id];
 const firstVisit=Object.keys(store.drafts).length===0;
 if(d){writeValues(t,d.v);$('[data-out="ig"]',P).value=d.ig||'';$('[data-out="x"]',P).value=d.x||'';banner.hidden=!d.example;}
 else if(firstVisit&&t.id==='publicacion'){writeValues(t,t.example);banner.hidden=false;generate(t,true);}
 else writeValues(t,{});
 updateMeters(P);bindPhotos(t);
 form.addEventListener('input',e=>{if(e.target.matches('[data-f]')){updateCounts(P);if(!banner.hidden){banner.hidden=true;}persist(t);}});
 form.addEventListener('change',e=>{if(e.target.matches('select[data-f]'))syncDynamic(t);persist(t);});
 form.addEventListener('submit',e=>{e.preventDefault();generate(t);if(innerWidth<=960)$('.aside',P).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});});
 $$('[data-out]',P).forEach(o=>o.addEventListener('input',()=>{updateMeters(P);persist(t);}));
 P.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const act=b.dataset.act;
  if(act==='gen')generate(t);
  else if(act==='mail')mail(t);
  else if(act==='example'){writeValues(t,t.example);banner.hidden=false;generate(t,true);toast('Ejemplo cargado');}
  else if(act==='clear'){writeValues(t,{});$$('[data-out]',P).forEach(o=>o.value='');banner.hidden=true;$('[data-mailbox]',P).hidden=true;updateMeters(P);persist(t);toast('Formulario vacío');}
  else if(b.dataset.copy){const o=$(`[data-out="${b.dataset.copy}"]`,P);if(!o.value){toast('Primero genera los textos');return;}copyText(o.value,o,b.dataset.copy==='ig'?'Texto de Instagram copiado':'Texto de X copiado');}
 });
});

/* settings */
$('#panel-inicio').addEventListener('input',e=>{const k=e.target.dataset.set;if(!k)return;store.settings[k]=e.target.value;save();T.forEach(syncDynamic);});

/* ---------- tabs ---------- */
function show(id){
 if(!TABS.some(t=>t.id===id))id='inicio';
 $$('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===id)));
 $$('.panel').forEach(p=>p.hidden=p.id!=='panel-'+id);
 const tb=$('#tab-'+id);tb&&tb.scrollIntoView({block:'nearest',inline:'nearest'});
 try{history.replaceState(null,'','#'+id);}catch(e){}
 try{localStorage.setItem('galeno-rrss-tab',id);}catch(e){}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-tab],[data-go]');if(!b)return;show(b.dataset.tab||b.dataset.go);if(b.dataset.go)window.scrollTo({top:0});});
tabsEl.addEventListener('keydown',e=>{
 if(!['ArrowRight','ArrowLeft'].includes(e.key))return;
 const bs=$$('.tab'),i=bs.indexOf(document.activeElement);if(i<0)return;
 const n=bs[(i+(e.key==='ArrowRight'?1:-1)+bs.length)%bs.length];n.focus();show(n.dataset.tab);
});
let start=(location.hash||'').slice(1);
if(!start){try{start=localStorage.getItem('galeno-rrss-tab')||'';}catch(e){}}
show(start||'inicio');
})();
</script>
